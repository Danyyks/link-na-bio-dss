<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSS Hub Tech</title>
<meta name="description" content="Dashboards e chatbots sob medida para pequenos negócios. Simplificando o seu digital.">
<meta name="theme-color" content="#0B1E29">
<meta property="og:type" content="website">
<meta property="og:title" content="DSS Hub Tech">
<meta property="og:description" content="Dashboards e chatbots sob medida para pequenos negócios.">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="assets/simbolo.svg">
<link rel="apple-touch-icon" href="assets/simbolo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#18394B;
    --deep:#0B1E29;
    --sky:#5FB4F0;
    --royal:#2952E3;
    --text:#F4F8FB;
    --muted:rgba(244,248,251,.68);
    --glass:rgba(255,255,255,.06);
    --glass-hover:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.12);
    --ease:cubic-bezier(.22,1,.36,1);
    --font-display:'Sora','Inter',system-ui,sans-serif;
    --font-text:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;overflow-x:clip}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:var(--font-text);
    color:var(--text);
    background:
      radial-gradient(900px 620px at 12% -8%, rgba(95,180,240,.28), transparent 60%),
      radial-gradient(800px 640px at 105% 6%, rgba(41,82,227,.34), transparent 58%),
      radial-gradient(700px 500px at 50% 110%, rgba(95,180,240,.10), transparent 60%),
      linear-gradient(170deg, #143244 0%, var(--deep) 62%, #08161E 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:clip;
  }
  /* grão sutil para dar profundidade */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  main{
    position:relative;width:100%;max-width:440px;
    padding:56px 20px 36px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .ring{
    position:absolute;top:-120px;left:50%;translate:-50% 0;
    width:400px;height:400px;border-radius:50%;
    border:1px solid rgba(95,180,240,.22);pointer-events:none;
  }
  .ring::after{
    content:"";position:absolute;inset:44px;border-radius:50%;
    border:1px solid rgba(95,180,240,.12);
  }

  /* entrada escalonada */
  .rise{opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
  @keyframes rise{to{opacity:1;transform:none}}

  .mark{
    position:relative;width:104px;height:104px;margin-bottom:24px;
    border-radius:30px;
    box-shadow:0 0 0 1px rgba(255,255,255,.16), 0 24px 48px -12px rgba(0,0,0,.55), 0 0 60px rgba(95,180,240,.22);
  }
  .mark img{width:100%;height:100%;display:block;border-radius:30px}
  .mark::after{ /* brilho de vidro no topo */
    content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,.22), transparent 42%);
  }

  h1{font-family:var(--font-display);font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
  h1 span{font-weight:400;color:var(--sky);letter-spacing:-.02em}
  .slogan{margin-top:10px;font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sky)}
  .lead{margin-top:18px;font-size:16px;line-height:1.55;color:var(--muted);max-width:340px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:22px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 10px 7px 8px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);
    font-family:var(--font-display);font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .chip .emo{font-size:14px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

  .links{width:100%;margin-top:34px;display:flex;flex-direction:column;gap:12px}
  .card{
    position:relative;display:flex;align-items:center;gap:14px;
    min-height:68px;padding:12px 16px 12px 12px;border-radius:22px;
    background:var(--glass);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    color:var(--text);text-decoration:none;text-align:left;
    box-shadow:0 10px 30px -14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .25s var(--ease), background .25s, border-color .25s;
    -webkit-tap-highlight-color:transparent;
  }
  .card .ico{
    flex:none;width:44px;height:44px;border-radius:14px;
    display:grid;place-items:center;
    background:rgba(255,255,255,.08);color:var(--sky);
  }
  .card .ico svg{width:22px;height:22px}
  .card .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .card .t{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.015em}
  .card .s{font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
  .card .go{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .25s var(--ease), color .25s}

  .card.primary{
    background:#fff;color:var(--brand);border-color:#fff;
    box-shadow:0 18px 40px -14px rgba(95,180,240,.55), 0 6px 16px -6px rgba(0,0,0,.4);
  }
  .card.primary .ico{background:#E8F2FB;color:var(--royal)}
  .card.primary .s,.card.primary .go{color:rgba(24,57,75,.62)}

  .card.soon{cursor:default;border-style:dashed;background:rgba(255,255,255,.03)}
  .card.soon .ico{opacity:.7}
  .card.soon .t{color:var(--muted)}
  .card.soon .s{color:var(--sky);font-weight:600}

  @media (hover:hover){
    .card:not(.soon):hover{transform:translateY(-2px);background:var(--glass-hover);border-color:rgba(255,255,255,.22)}
    .card.primary:hover{background:#fff;border-color:#fff}
    .card:not(.soon):hover .go{transform:translateX(3px);color:var(--text)}
    .card.primary:hover .go{color:var(--brand)}
  }
  .card:not(.soon):active{transform:scale(.98)}
  .card:focus-visible{outline:2px solid var(--sky);outline-offset:3px}

  footer{margin-top:40px;font-size:12.5px;color:rgba(244,248,251,.5);letter-spacing:.01em}

  @media (prefers-reduced-motion:reduce){
    .rise{animation:none;opacity:1;transform:none}
    .card,.card .go{transition:none}
  }
  @media (min-width:600px){
    main{padding-top:88px}
  }
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>

  <div class="mark rise" style="--i:0"><img src="assets/simbolo.svg" alt="Símbolo da DSS Hub Tech" width="104" height="104"></div>

  <h1 class="rise" style="--i:1">DSS Hub <span>Tech</span></h1>
  <p class="slogan rise" style="--i:2">simplificando o seu digital</p>
  <p class="lead rise" style="--i:3">Dashboards e chatbots sob medida para pequenos negócios ficarem mais fáceis de gerir.</p>

  <div class="chips rise" style="--i:4">
    <span class="chip"><span class="emo" aria-hidden="true">📊</span>Finanças</span>
    <span class="chip"><span class="emo" aria-hidden="true">🤖</span>Atendimento</span>
    <span class="chip"><span class="emo" aria-hidden="true">📦</span>Operação</span>
  </div>

  <nav class="links" aria-label="Links">
    <a class="card primary rise" style="--i:5" id="mail">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></span>
      <span class="txt"><span class="t">Peça um orçamento</span><span class="s">Por e-mail, sem compromisso</span></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>

    <a class="card rise" style="--i:6" id="ig" target="_blank" rel="noopener">
      <span class="ico brand-ig"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg></span>
      <span class="txt"><span class="t">Instagram</span><span class="s" id="ig-handle"></span></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>

    <div class="card soon rise" style="--i:7" role="link" aria-disabled="true">
      <span class="ico brand-wa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span>
      <span class="txt"><span class="t">WhatsApp</span><span class="s">Em breve</span></span>
    </div>
  </nav>

  <footer class="rise" style="--i:8">© 2026 · Do briefing ao deploy, sob medida.</footer>
</main>

<script>
  // Edite só aqui.
  const CONFIG = {
    // whatsapp: (em breve) ativar quando houver número
    instagram: "dsshubtech",
    email: "suellengarcia.silva@gmail.com",
    emailSubject: "Quero conhecer a DSS Hub Tech"
  };
  const $ = id => document.getElementById(id);
  $("ig").href = "https://instagram.com/" + CONFIG.instagram;
  $("ig-handle").textContent = "@" + CONFIG.instagram;
  $("mail").href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent(CONFIG.emailSubject);
</script>
</body>
</html>
